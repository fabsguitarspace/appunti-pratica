version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Storia completa: versione_git.py conta i commit per la patch e legge la data dell'ultimo.
    post_checkout:
      - git fetch --unshallow || true
    
sphinx:
  configuration: src/docs/conf.py

python:
  install:
    - requirements: requirements.txt

# Build PDF & ePub
formats:
  - epub
  - pdf
